name: Preview OTA Release

on:
  push:
    # バージョンタグ（v1.2.3 形式）で自動トリガー
    # JS・アセットの変更のみなら APK 再ビルド不要 → EAS Update で preview チャンネルへ OTA 配信
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────
  # EAS Update: preview チャンネルへ OTA 配信（ビルド・署名・Release 作成なし）
  # APK 再ビルドが必要な場合（ネイティブ変更）は preview-apk.yml を手動実行する
  # ─────────────────────────────────────────────
  ota:
    name: Publish Preview Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # eas update が git コミットを特定するため履歴を取得する
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish update to preview channel
        env:
          # eas.json の preview プロファイルと同じ env（APP_VARIANT / Storybook 無効）でバンドルする
          APP_VARIANT: "preview"
          EXPO_PUBLIC_STORYBOOK_ENABLED: "false"
        run: |
          eas update \
            --branch main \
            --channel preview \
            --message "Preview OTA ${{ github.ref_name }} (${{ github.sha }})" \
            --non-interactive