name: Desktop Build (Electrobun, reusable)

on:
  workflow_call:
    inputs:
      ref:
        description: "ビルドする ref（空なら呼び出し元の ref）"
        required: false
        type: string
        default: ""
      release_tag:
        description: "成果物をアップロードする固定タグの Release"
        required: true
        type: string
      upload_installers:
        description: "インストーラもアップロードする（手動 canary 用）"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Canary build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Electrobun(Hutch) はクロスコンパイルできないため、各 OS のネイティブランナーでビルドする
          - os: macos-14 # arm64
          - os: macos-15-intel # x86_64
          - os: windows-latest # x86_64
          - os: ubuntu-24.04 # x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "latest"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web bundle
        run: bun run build:web

      - name: Build desktop (canary)
        run: bunx electrobun build --env=canary

      - name: Publish to fixed canary release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          # 4ジョブが同時に走るため、Release 作成は競合しても成功扱いにする
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --prerelease \
              --title "Desktop canary" \
              --notes "Electrobun の canary ビルド。インストーラと自動更新用の成果物を格納する。" ||
              gh release view "$RELEASE_TAG" >/dev/null
          fi

          if [ "${{ inputs.upload_installers }}" = "true" ]; then
            gh release upload "$RELEASE_TAG" artifacts/* --clobber
          else
            # OTA に必要な update.json / tar.zst / 差分パッチだけを更新する
            files=(artifacts/*-update.json artifacts/*.tar.zst artifacts/*.patch)
            if [ -e "${files[0]}" ]; then
              gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
            fi
          fi