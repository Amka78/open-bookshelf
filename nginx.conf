# Shoin SPA 配信 (nginx.conf)
#
# ※ このファイルはテンプレートである。
#    コンテナ起動時に docker-entrypoint.sh が HTTPS_PORT 環境変数
#    （HTTP→HTTPS リダイレクト先のホスト側ポート）だけを envsubst で展開し、
#    /etc/nginx/conf.d/default.conf を生成する。
#    $host / $uri / $request_uri などの nginx 変数は展開対象外。

# HTTP → HTTPS リダイレクト
server {
    listen 80;
    server_name _;

    # ヘルスチェックは HTTP のまま直接応答
    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    location / {
        return 301 https://$host:${HTTPS_PORT}$request_uri;
    }
}

# HTTPS（自己署名証明書・エントリポイントが /etc/nginx/ssl に自動生成）
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root  /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Calibre プロキシ（Web リリース用）。同一オリジンにして CORS を回避する。
    # 実体は entrypoint が起動する /usr/local/bin/web-calibre-proxy。
    location /__calibre/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 画像・ファイルのストリーミングと大きなアップロードを通す
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 100m;
    }

    # Expo static assets — cache aggressively (content-hashed filenames)
    location /_expo/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA shell — must revalidate every time.
    # Without this, browsers apply heuristic caching (no Cache-Control + Last-Modified)
    # and keep referencing stale hashed bundles, which are themselves immutable for 1y.
    # Reached both directly and via the try_files internal redirect above.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Disable access log for health checks
    location = /healthz {
        access_log off;
        return 200 "ok";
    }
}