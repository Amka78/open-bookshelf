services:
  open-bookshelf:
    image: ghcr.io/amka78/open-bookshelf:latest
    container_name: open-bookshelf
    ports:
      # HTTP は HTTPS へのリダイレクト用（従来の ${PORT} 動作を維持）
      - "${PORT:-3000}:80"
      # HTTPS 本体。ホスト 80/443 を NPM 等が使っている場合は HTTPS_PORT で変更する
      - "${HTTPS_PORT:-8443}:443"
    environment:
      # HTTP→HTTPS リダイレクト先のホスト側ポート（コンテナ内部は常に 443）
      HTTPS_PORT: "${HTTPS_PORT:-8443}"
      # 自己署名証明書の CN / SAN。LAN の IP で接続する場合は HTTPS_SAN_IP にその IP を指定
      HTTPS_CN: "${HTTPS_CN:-localhost}"
      HTTPS_SAN_IP: "${HTTPS_SAN_IP:-}"
      HTTPS_SAN_DNS: "${HTTPS_SAN_DNS:-}"
      # Calibre プロキシ（同一オリジン化して CORS を回避）。0/false/off で無効化
      CALIBRE_PROXY: "${CALIBRE_PROXY:-1}"
      # 外部公開する場合は接続先を制限する（カンマ区切りの host / host:port）
      CALIBRE_PROXY_ALLOWED_HOSTS: "${CALIBRE_PROXY_ALLOWED_HOSTS:-}"
    volumes:
      # 証明書を永続化（Watchtower による再作成後もブラウザの警告が再発しない）
      - ssl-certs:/etc/nginx/ssl
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.scope=open-bookshelf"

  # Watchtower: GHCR の新イメージを検知して自動で pull & 再起動
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # ghcr.io のイメージは公開（認証不要）なので Docker 認証情報はマウントしない。
      # 存在しないパスをマウントすると Docker が空ディレクトリを生成し、
      # Watchtower が "read /config.json: is a directory" で更新に失敗し続ける。
    environment:
      # 5分ごとに新イメージを確認
      WATCHTOWER_POLL_INTERVAL: 300
      # 古いイメージを自動削除
      WATCHTOWER_CLEANUP: true
      # 監視対象をこの compose のコンテナのみに限定
      WATCHTOWER_SCOPE: open-bookshelf
    command: --scope open-bookshelf
    restart: unless-stopped

volumes:
  # 自己署名証明書の永続化先。コンテナが参照する名前付きボリュームは
  # ここで宣言しないと "refers to undefined volume" で compose が起動しない。
  ssl-certs:


